services:
  postgres:
    image: postgres:17-alpine
    container_name: linear-postgres
    environment:
      POSTGRES_DB: linear
      POSTGRES_USER: linear
      POSTGRES_PASSWORD: linear_dev
    ports:
      - "5432:5432"
    volumes:
      - linear-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linear -d linear"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  linear-postgres-data:
